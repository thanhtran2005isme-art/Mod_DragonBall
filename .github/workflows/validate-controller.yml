name: Validate WinForms controller

on:
  push:
    branches:
      - main
      - feature/windows-controller-ui
    paths:
      - "controller/**"
      - "controller-run.bat"
      - ".github/workflows/validate-controller.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build controller/DragonController/DragonController.csproj -c Release
